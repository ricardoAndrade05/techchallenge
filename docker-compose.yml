version: '3.8'

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: techchallenge_db
    restart: always
    environment:
      POSTGRES_DB: techchallenge_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: