spring:
  application:
    name: postech
  jpa:
    hibernate:
      ddl-auto: create
    defer-datasource-initialization: true
    properties:
      "[hibernate.hbm2ddl.import_files]": massa-testes.sql	
  datasource:
    url: jdbc:h2:mem:postech;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password: sa
  h2:
    console:
      enabled: true
      path: /h2-console