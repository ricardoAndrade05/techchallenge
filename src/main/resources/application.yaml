spring:
  application:
    name: tech-challenge-delivery
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME} 
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        '[format_sql]': false
        '[dialect]': org.hibernate.dialect.PostgreSQLDialect
  profiles:
    active: ${PROFILE}
application:
  jwt:
    expiration: ${JWT_EXPIRATION}
    public:
      key: ${JWT_PUBLIC_KEY}
    private:
      key: ${JWT_PRIVATE_KEY}